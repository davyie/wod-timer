<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Crown button -->
  <rect x="13.5" y="1" width="5" height="3.5" rx="1.75" fill="#ff4f8f"/>
  <!-- Left lug -->
  <rect x="9" y="3.5" width="3.5" height="2" rx="1" fill="#ff4f8f" transform="rotate(-35 10.75 4.5)"/>
  <!-- Right lug -->
  <rect x="19.5" y="3.5" width="3.5" height="2" rx="1" fill="#ff4f8f" transform="rotate(35 21.25 4.5)"/>
  <!-- Outer body -->
  <circle cx="16" cy="19" r="12" fill="#0d0d1a" stroke="#ff4f8f" stroke-width="2"/>
  <!-- Tick 12 -->
  <line x1="16" y1="9.5" x2="16" y2="12" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tick 3 -->
  <line x1="26.5" y1="19" x2="24" y2="19" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tick 6 -->
  <line x1="16" y1="28.5" x2="16" y2="26" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tick 9 -->
  <line x1="5.5" y1="19" x2="8" y2="19" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing up) -->
  <line x1="16" y1="19" x2="16" y2="12" stroke="#d0d0e8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Second hand (pointing ~2 o'clock) -->
  <line x1="16" y1="19" x2="21" y2="15" stroke="#ff4f8f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="19" r="2" fill="#ff4f8f"/>
</svg>
