spring.application.name=timer-backend
server.port=8080

spring.cloud.azure.cosmos.endpoint=${COSMOS_ENDPOINT}
spring.cloud.azure.cosmos.key=${COSMOS_KEY}
spring.cloud.azure.cosmos.database=${COSMOS_DATABASE:timer-db}
spring.cloud.azure.cosmos.populate-query-metrics=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
